<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Commit → validation → Pages</title><desc id="desc">A source write is not closed until the intended head passes validation and the deployed artifact is read back.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#98a2b3"/></marker></defs><rect width="1200" height="700" fill="#f6f8fb"/><rect x="55" y="55" width="1090" height="590" rx="28" fill="#ffffff" stroke="#dfe4ea" stroke-width="2"/><rect x="55" y="55" width="1090" height="82" rx="28" fill="#172033"/><text x="90" y="105" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#ffffff">Commit → validation → Pages</text><text x="90" y="195" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#175cd3">JP AEC OPERATIONS GUIDE</text><foreignObject x="90" y="220" width="1020" height="88"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,sans-serif;font-size:20px;line-height:1.45;color:#475467">A source write is not closed until the intended head passes validation and the deployed artifact is read back.</div></foreignObject><line x1="242" y1="415" x2="302" y2="415" stroke="#98a2b3" stroke-width="3" marker-end="url(#arrow)"/><line x1="462" y1="415" x2="522" y2="415" stroke="#98a2b3" stroke-width="3" marker-end="url(#arrow)"/><line x1="682" y1="415" x2="742" y2="415" stroke="#98a2b3" stroke-width="3" marker-end="url(#arrow)"/><line x1="902" y1="415" x2="962" y2="415" stroke="#98a2b3" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="90" y="360" width="150" height="110" rx="18" fill="#ffffff" stroke="#cfd6df" stroke-width="2"/><circle cx="114" cy="385" r="12" fill="#475467"/><text x="114" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">1</text><text x="165" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Commit</text></g><g><rect x="310" y="360" width="150" height="110" rx="18" fill="#ffffff" stroke="#cfd6df" stroke-width="2"/><circle cx="334" cy="385" r="12" fill="#475467"/><text x="334" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">2</text><text x="385" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Schema checks</text></g><g><rect x="530" y="360" width="150" height="110" rx="18" fill="#ffffff" stroke="#cfd6df" stroke-width="2"/><circle cx="554" cy="385" r="12" fill="#475467"/><text x="554" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">3</text><text x="605" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Route checks</text></g><g><rect x="750" y="360" width="150" height="110" rx="18" fill="#ffffff" stroke="#cfd6df" stroke-width="2"/><circle cx="774" cy="385" r="12" fill="#475467"/><text x="774" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">4</text><text x="825" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Pages artifact</text></g><g><rect x="970" y="360" width="150" height="110" rx="18" fill="#eef4ff" stroke="#84adff" stroke-width="2"/><circle cx="994" cy="385" r="12" fill="#175cd3"/><text x="994" y="389" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">5</text><text x="1045" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#172033">Readback PASS</text></g><rect x="90" y="535" width="1020" height="68" rx="16" fill="#ecfdf3" stroke="#abefc6"/><text x="112" y="577" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#05603a">Rule: preserve evidence, stable IDs and source ownership before convenience.</text></svg>