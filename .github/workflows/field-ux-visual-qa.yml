name: Field Desk and Map visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/daily-ops-current-work
    paths:
      - 'VERSION'
      - 'docs/releases/**'
      - 'ops/control/milestone-v2.1.0.json'
      - 'index.html'
      - 'assets/js/hero-field.js'
      - 'assets/js/site-shell.js'
      - 'assets/css/site-shell.css'
      - 'assets/css/jp-*.css'
      - 'assets/botanical/**'
      - 'controls/**'
      - 'scripts/qa_botanical_theme.py'
      - 'pending/index.html'
      - 'controls/index.html'
      - 'guide/3-pages/index.html'
      - 'guide/7-pages/index.html'
      - 'guide/15-pages/index.html'
      - 'site-operations.html'
      - 'site-operations/coordination.html'
      - 'site-operations/history.html'
      - 'site-operations/questions.html'
      - 'site-operations/schedule.html'
      - 'site-operations/project.html'
      - 'resources/index.html'
      - 'resources/field/**'
      - 'assets/js/a9-*.js'
      - 'assets/css/a9-ui-extensions.css'
      - 'ops/data/a9-*.json'
      - 'ops/control/a9-page-section-registry.v1.0.json'
      - 'scripts/qa_a9_manual_browser.py'
      - 'ops/data/resource-catalog-normalized.v0.1.json'
      - 'ops/data/progress-report-public.v0.2.jsonl'
      - 'workspace/index.html'
      - 'workspace/developer-links.v0.1.json'
      - 'workspace/backlog/**'
      - 'workspace/developer-software-backlog.v0.1.json'
      - 'scripts/validate_developer_workspace.py'
      - 'ops/control/website-eight-request-roadmap.v0.1.json'
      - 'ops/data/pending-works.json'
      - 'guide/**'
      - 'map.html'
      - 'assets/css/app.css'
      - 'assets/js/app.js'
      - 'ops/data/current-works.json'
      - 'ops/data/project-resources.json'
      - 'scripts/qa_field_ux_browser.py'
      - '.github/workflows/field-ux-visual-qa.yml'

permissions:
  contents: read

jobs:
  field-ux-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out published project source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser harness
        run: |
          python -m pip install playwright==1.55.0
          npm install --no-save --no-package-lock --ignore-scripts axe-core@4.10.3
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Browser field and map user journey QA
        run: python scripts/qa_field_ux_browser.py
      - name: Botanical theme matrix, keyboard, print and before/after QA
        run: python scripts/qa_botanical_theme.py
      - name: A9 field, checklist, progress and memory mobile browser smoke
        run: python scripts/qa_a9_manual_browser.py

      - name: Archive desktop and mobile screenshots for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-ux-screenshots
          path: |
            artifacts/field-ux/
            artifacts/botanical-theme/
          if-no-files-found: warn
          retention-days: 30
