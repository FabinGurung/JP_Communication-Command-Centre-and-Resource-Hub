name: Validate project data

on:
  push:
    branches: ["main"]
    paths:
      - "projects.csv"
      - "map-config.json"
      - ".github/workflows/validate-projects.yml"
  pull_request:
    paths:
      - "projects.csv"
      - "map-config.json"
      - ".github/workflows/validate-projects.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate canonical project master
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          required = {
              "project_id",
              "company_project_code",
              "legacy_project_code",
              "project_name",
              "display_name",
              "executing_company_id",
              "latitude",
              "longitude",
              "status",
              "physical_progress_percent",
              "financial_progress_percent",
              "last_updated",
              "latest_update",
              "photo_url",
              "details_url",
              "public_notes",
              "is_public",
          }

          config = json.loads(Path("map-config.json").read_text(encoding="utf-8"))
          allowed_statuses = set(config["status_styles"])

          with Path("projects.csv").open(newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
              headers = set(reader.fieldnames or [])

          missing_headers = sorted(required - headers)
          if missing_headers:
              raise SystemExit(f"Missing required columns: {missing_headers}")
          if not rows:
              raise SystemExit("projects.csv contains no project rows.")

          seen_project_ids = set()
          seen_company_codes = set()
          seen_legacy_codes = set()
          errors = []

          for line_number, row in enumerate(rows, start=2):
              project_id = (row.get("project_id") or "").strip()
              company_code = (row.get("company_project_code") or "").strip()
              legacy_code = (row.get("legacy_project_code") or "").strip()

              if not project_id:
                  errors.append(f"Line {line_number}: project_id is blank")
              elif project_id in seen_project_ids:
                  errors.append(f"Line {line_number}: duplicate project_id {project_id}")
              else:
                  seen_project_ids.add(project_id)

              if company_code:
                  if company_code in seen_company_codes:
                      errors.append(f"Line {line_number}: duplicate company_project_code {company_code}")
                  seen_company_codes.add(company_code)

              if legacy_code:
                  if legacy_code in seen_legacy_codes:
                      errors.append(f"Line {line_number}: duplicate legacy_project_code {legacy_code}")
                  seen_legacy_codes.add(legacy_code)

              for field in ("project_name", "display_name", "executing_company_id", "status", "latitude", "longitude"):
                  if not (row.get(field) or "").strip():
                      errors.append(f"Line {line_number}: {field} is blank")

              try:
                  latitude = float(row["latitude"])
                  if not -90 <= latitude <= 90:
                      errors.append(f"Line {line_number}: latitude outside -90..90")
              except (TypeError, ValueError):
                  errors.append(f"Line {line_number}: latitude is not numeric")

              try:
                  longitude = float(row["longitude"])
                  if not -180 <= longitude <= 180:
                      errors.append(f"Line {line_number}: longitude outside -180..180")
              except (TypeError, ValueError):
                  errors.append(f"Line {line_number}: longitude is not numeric")

              status = (row.get("status") or "").strip()
              if status and status not in allowed_statuses:
                  errors.append(
                      f"Line {line_number}: unknown status {status!r}; "
                      f"allowed values are {sorted(allowed_statuses)}"
                  )

              for field in ("physical_progress_percent", "financial_progress_percent"):
                  value = (row.get(field) or "").strip()
                  if value:
                      try:
                          number = float(value)
                          if not 0 <= number <= 100:
                              errors.append(f"Line {line_number}: {field} outside 0..100")
                      except ValueError:
                          errors.append(f"Line {line_number}: {field} is not numeric")

              public_value = (row.get("is_public") or "").strip().lower()
              if public_value not in {"true", "false", "1", "0", "yes", "no", "y", "n"}:
                  errors.append(f"Line {line_number}: is_public must be TRUE or FALSE")

          if errors:
              print("\n".join(errors))
              raise SystemExit(f"Validation failed with {len(errors)} error(s).")

          print(
              f"Validation passed for {len(rows)} project row(s); "
              f"allowed lifecycle statuses={sorted(allowed_statuses)}."
          )
