name: Operations from Google Sheets
on:
  pull_request:
    paths:
      - 'publication/operations/**'
      - 'feasibility/index.html'
      - 'feasibility/buyer-guide/index.html'
      - 'feasibility/buyer-guide/guide.json'
      - 'ops/data/land-feasibility/astam-village-public.v1.0.json'
      - 'ops/data/land-feasibility/astam-buyer-guide-public.v1.0.json'
      - 'docs/releases/v2.3.0.md'
      - 'docs/releases/v2.4.0.md'
      - 'docs/releases/v2.5.0.md'
      - 'docs/releases/v2.5.1.md'
      - 'docs/releases/v2.6.0.md'
      - 'docs/releases/v2.7.0.md'
      - 'docs/releases/v2.8.0.md'
      - 'docs/releases/v2.9.0.md'
      - 'docs/releases/v3.0.0.md'
      - 'docs/releases/v3.1.0.md'
      - 'docs/releases/v3.2.0.md'
      - 'docs/operations/EXTRACTION_WORKFLOW_RUN01.md'
      - 'docs/operations/OPERATIONS_SOURCE_DECISIONS_MEMORY_WALL.md'
      - 'ops/control/operations-source-decision-ledger.v1.json'
      - 'scripts/build_status_filter_fixture.py'
      - 'scripts/status_filter_browser_qa.cjs'
      - 'scripts/validate_ops_source_memory.py'
      - 'AGENTS.md'
      - 'docs/operations/ENGINEER_FIRST_MAP_AND_RESOURCE_BOUNDARY.md'
      - 'A7_MODULE.json'
      - 'ops/control/branch-lane-registry.json'
      - 'docs/operations/LIVE_PROJECT_IDENTITY_AND_SOURCE_DATES.md'
      - 'scripts/publish_operations.py'
      - 'scripts/notification_projection.py'
      - 'scripts/sheets_read.py'
      - 'scripts/test_ops_publication.py'
      - '.github/workflows/operations-sheets-pages.yml'
  push:
    branches:
      - main
      - feature/daily-ops-current-work
    paths:
      - 'publication/operations/**'
      - 'feasibility/index.html'
      - 'feasibility/buyer-guide/index.html'
      - 'feasibility/buyer-guide/guide.json'
      - 'ops/data/land-feasibility/astam-village-public.v1.0.json'
      - 'ops/data/land-feasibility/astam-buyer-guide-public.v1.0.json'
      - 'docs/releases/v2.3.0.md'
      - 'docs/releases/v2.4.0.md'
      - 'docs/releases/v2.5.0.md'
      - 'docs/releases/v2.5.1.md'
      - 'docs/releases/v2.6.0.md'
      - 'docs/releases/v2.7.0.md'
      - 'docs/releases/v2.8.0.md'
      - 'docs/releases/v2.9.0.md'
      - 'docs/releases/v3.0.0.md'
      - 'docs/releases/v3.1.0.md'
      - 'docs/releases/v3.2.0.md'
      - 'docs/operations/EXTRACTION_WORKFLOW_RUN01.md'
      - 'docs/operations/OPERATIONS_SOURCE_DECISIONS_MEMORY_WALL.md'
      - 'ops/control/operations-source-decision-ledger.v1.json'
      - 'scripts/build_status_filter_fixture.py'
      - 'scripts/status_filter_browser_qa.cjs'
      - 'scripts/validate_ops_source_memory.py'
      - 'AGENTS.md'
      - 'docs/operations/ENGINEER_FIRST_MAP_AND_RESOURCE_BOUNDARY.md'
      - 'A7_MODULE.json'
      - 'ops/control/branch-lane-registry.json'
      - 'docs/operations/LIVE_PROJECT_IDENTITY_AND_SOURCE_DATES.md'
      - 'scripts/publish_operations.py'
      - 'scripts/notification_projection.py'
      - 'scripts/sheets_read.py'
      - 'scripts/test_ops_publication.py'
      - '.github/workflows/operations-sheets-pages.yml'
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ops-sheets-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check publication/operations/app.js
      - run: node --check publication/operations/progress.js
      - run: node --check publication/operations/sources.js
      - run: node --check publication/operations/extraction.js
      - run: node --check publication/operations/closed-work.js
      - run: node --check scripts/status_filter_browser_qa.cjs
      - run: python -m unittest discover -s scripts -p 'test_ops_publication.py' -v
      - run: python scripts/validate_ops_source_memory.py

  browser-status-qa:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: python scripts/build_status_filter_fixture.py _status_preview
      - name: Exercise mobile and desktop status source controls in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory _status_preview >/tmp/ops-status-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8766/operations.json -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/status_filter_browser_qa.cjs

  project:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || vars.JP_OPERATIONS_PAGES_MODE == 'SHEETS_V2') &&
      (github.event_name == 'schedule' || needs['browser-status-qa'].result == 'success')
    needs: [test, browser-status-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Google configuration
        env:
          WIF_PROVIDER: ${{ vars.JP_GOOGLE_MAIN_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Configure the repository's Google Workload Identity provider and service account variables."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.JP_GOOGLE_MAIN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read Sheets and build public files
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish_operations.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.JP_OPERATIONS_PAGES_MODE == 'SHEETS_V2' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  release-reviewed-closures-v3-2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify separate closure page, original Sheets, and tag v3.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v3.2.0.md'
          tag='v3.2.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo 'v3.2 release notes not changed; skip tag'
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css extraction.html extraction.js closed-work.html closed-work.js progress.html progress.js sources.html sources.js memory-wall.html owner-help.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "publication/operations/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/closed-work.json?commit=$GITHUB_SHA" \
          | python -c 'import json,sys; d=json.load(sys.stdin); r=d["records"]; assert d["kind"]=="SOURCE_REVIEWED_CLOSED_WORK"; assert len(r)==d["total"]; assert sum(d["decisions"].values())==d["total"]; assert all(x["decision"] in {"COMPLETED","NOT_REQUIRED","CANCELLED","SUPERSEDED"} for x in r); assert len({x["kind"]+":"+x["id"] for x in r})==len(r); assert all("closure_reason" not in x and "closure_reviewer" not in x and "closure_evidence" not in x for x in r); assert "PRJ-000030" not in {x["project_id"] for x in r}; print("CLOSED_WORK_REVIEWED_PUBLIC_PASS",d["total"])'
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
          | python -c 'import json,sys; d=json.load(sys.stdin); assert d["provenance"]["live_workbook_count"]==7; assert d["provenance"]["source_authority"]=="GOOGLE_SHEETS"; assert len(d["projects"])==d["identity"]["public_project_count"]; assert "PRJ-000030" not in {x["id"] for x in d["projects"]}; print("SEVEN_SHEETS_PROJECTS_PRESERVED",len(d["projects"]),len(d["notices"]),len(d["progress"]))'
          for entry in resources/project-documents.html feasibility/index.html feasibility/buyer-guide/index.html; do
            body=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$entry?commit=$GITHUB_SHA")
            grep -Fq 'u.search = location.search' <<< "$body"
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'JP Site Operations — Reviewed Closed Work v3.2.0' --notes-file "$notes"
          fi
