name: Operations from Google Sheets
on:
  pull_request:
    paths:
      - 'publication/operations/**'
      - 'feasibility/index.html'
      - 'feasibility/buyer-guide/index.html'
      - 'feasibility/buyer-guide/guide.json'
      - 'ops/data/land-feasibility/astam-village-public.v1.0.json'
      - 'ops/data/land-feasibility/astam-buyer-guide-public.v1.0.json'
      - 'docs/releases/v2.3.0.md'
      - 'docs/releases/v2.4.0.md'
      - 'docs/releases/v2.5.0.md'
      - 'docs/releases/v2.5.1.md'
      - 'docs/releases/v2.6.0.md'
      - 'docs/releases/v2.7.0.md'
      - 'docs/releases/v2.8.0.md'
      - 'docs/releases/v2.9.0.md'
      - 'docs/releases/v3.0.0.md'
      - 'docs/operations/FOUR_LANE_EXTRACTION_RUN001.md'
      - 'docs/operations/OPERATIONS_SOURCE_DECISIONS_MEMORY_WALL.md'
      - 'ops/control/operations-source-decision-ledger.v1.json'
      - 'scripts/build_status_filter_fixture.py'
      - 'scripts/status_filter_browser_qa.cjs'
      - 'scripts/validate_ops_source_memory.py'
      - 'AGENTS.md'
      - 'docs/operations/ENGINEER_FIRST_MAP_AND_RESOURCE_BOUNDARY.md'
      - 'A7_MODULE.json'
      - 'ops/control/branch-lane-registry.json'
      - 'docs/operations/LIVE_PROJECT_IDENTITY_AND_SOURCE_DATES.md'
      - 'scripts/publish_operations.py'
      - 'scripts/notification_projection.py'
      - 'scripts/sheets_read.py'
      - 'scripts/test_ops_publication.py'
      - '.github/workflows/operations-sheets-pages.yml'
  push:
    branches:
      - main
      - feature/daily-ops-current-work
    paths:
      - 'publication/operations/**'
      - 'feasibility/index.html'
      - 'feasibility/buyer-guide/index.html'
      - 'feasibility/buyer-guide/guide.json'
      - 'ops/data/land-feasibility/astam-village-public.v1.0.json'
      - 'ops/data/land-feasibility/astam-buyer-guide-public.v1.0.json'
      - 'docs/releases/v2.3.0.md'
      - 'docs/releases/v2.4.0.md'
      - 'docs/releases/v2.5.0.md'
      - 'docs/releases/v2.5.1.md'
      - 'docs/releases/v2.6.0.md'
      - 'docs/releases/v2.7.0.md'
      - 'docs/releases/v2.8.0.md'
      - 'docs/releases/v2.9.0.md'
      - 'docs/releases/v3.0.0.md'
      - 'docs/operations/FOUR_LANE_EXTRACTION_RUN001.md'
      - 'docs/operations/OPERATIONS_SOURCE_DECISIONS_MEMORY_WALL.md'
      - 'ops/control/operations-source-decision-ledger.v1.json'
      - 'scripts/build_status_filter_fixture.py'
      - 'scripts/status_filter_browser_qa.cjs'
      - 'scripts/validate_ops_source_memory.py'
      - 'AGENTS.md'
      - 'docs/operations/ENGINEER_FIRST_MAP_AND_RESOURCE_BOUNDARY.md'
      - 'A7_MODULE.json'
      - 'ops/control/branch-lane-registry.json'
      - 'docs/operations/LIVE_PROJECT_IDENTITY_AND_SOURCE_DATES.md'
      - 'scripts/publish_operations.py'
      - 'scripts/notification_projection.py'
      - 'scripts/sheets_read.py'
      - 'scripts/test_ops_publication.py'
      - '.github/workflows/operations-sheets-pages.yml'
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ops-sheets-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node --check publication/operations/app.js
      - run: node --check publication/operations/progress.js
      - run: node --check publication/operations/sources.js
      - run: node --check publication/operations/navigation.js
      - run: node --check publication/operations/extraction.js
      - run: node --check scripts/status_filter_browser_qa.cjs
      - run: python -m unittest discover -s scripts -p 'test_ops_publication.py' -v
      - run: python scripts/validate_ops_source_memory.py

  browser-status-qa:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: python scripts/build_status_filter_fixture.py _status_preview
      - name: Exercise mobile and desktop status source controls in Chromium
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8766 --directory _status_preview >/tmp/ops-status-qa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8766/operations.json -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/status_filter_browser_qa.cjs

  project:
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      needs.test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || vars.JP_OPERATIONS_PAGES_MODE == 'SHEETS_V2') &&
      (github.event_name == 'schedule' || needs['browser-status-qa'].result == 'success')
    needs: [test, browser-status-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Google configuration
        env:
          WIF_PROVIDER: ${{ vars.JP_GOOGLE_MAIN_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$WIF_PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Configure the repository's Google Workload Identity provider and service account variables."
            exit 1
          fi
      - uses: google-github-actions/auth@v3
        id: auth
        with:
          workload_identity_provider: ${{ vars.JP_GOOGLE_MAIN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.JP_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Read Sheets and build public files
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish_operations.py --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.JP_OPERATIONS_PAGES_MODE == 'SHEETS_V2' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: project
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  release-cutover:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify and publish the cutover milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.3.0.md'
          tag='v2.3.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$pages/owner-help.html?release=$GITHUB_SHA" | cmp - 'publication/operations/owner-help.html'
          curl -fsS --retry 4 --retry-delay 3 --retry-all-errors "$pages/feasibility/buyer-guide/guide.json?release=$GITHUB_SHA" | cmp - 'feasibility/buyer-guide/guide.json'
          refs="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")"
          if [ -n "$refs" ]; then
            test "$(printf '%s\n' "$refs" | tail -n 1 | cut -f1)" = "$GITHUB_SHA"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Operations Sheets Cutover v2.3.0' --notes-file "$notes"
          fi

  release-maps-v2-4:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify published dashboard and tag release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.4.0.md'
          tag='v2.4.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No v2.4.0 release-note change in this main push"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in app.js styles.css index.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "publication/operations/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; x=json.load(sys.stdin); assert x["provenance"]["kind"] == "PUBLIC_SAFE_READ_ONLY_SHEETS_PROJECTION"'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing release must not be replaced or retargeted"
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Project Maps and Progress Dashboard v2.4.0' --notes-file "$notes"
          fi

  release-pages-links:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify live cross-site routes and publish v2.5.1
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.5.1.md'
          tag='v2.5.1'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No new v2.5.1 release note in this push"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in app.js styles.css index.html owner-help.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "publication/operations/$file"
          done
          library="https://fabingurung.github.io/jp-field-desk-library/"
          catalogue=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/resources/index.html?commit=$GITHUB_SHA")
          packet=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/resources/project-documents.html?commit=$GITHUB_SHA")
          grep -Fq "href=\"$library\"" <<< "$catalogue"
          grep -Fq "href=\"${library}resources/project-documents.html\"" <<< "$packet"
          grep -Fq 'u.search = location.search' <<< "$packet"
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; x=json.load(sys.stdin); p=x["provenance"]; i=x["identity"]; assert p["schema_version"] == "1.2.0"; assert p["kind"] == "PUBLIC_SAFE_READ_ONLY_SHEETS_PROJECTION"; assert p["provider_modified_at"] is None; assert set(p["source_dates"]) == {"projects","notifications","progress"}; assert i["current_authority"] == "LIVE_GOOGLE_SHEETS_APPROVED_PUBLIC_ROWS"; assert i["public_project_count"] == len(x["projects"]); assert i["nonpublic_or_retired_rows_excluded"] is True; assert set(i["public_ids_added_since_historical_index"]).issubset({p["id"] for p in x["projects"]}); print("LIVE_SOURCE_DATES_AND_IDENTITY_PASS", i["public_project_count"])'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Existing milestone must not be retargeted"
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Operations v2.5.1 — Canonical Pages Links' --notes-file "$notes"
          fi

  release-field-map-v2-6:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify live field map and Astam redirects before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.6.0.md'
          tag='v2.6.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No new v2.6.0 notes in this main push"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css owner-help.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "publication/operations/$file"
          done
          for entry in feasibility/index.html feasibility/buyer-guide/index.html; do
            body=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$entry?commit=$GITHUB_SHA")
            grep -Fq 'https://fabingurung.github.io/jp-field-desk-library/feasibility/' <<< "$body"
            grep -Fq 'u.search = location.search' <<< "$body"
          done
          packet=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/resources/project-documents.html?commit=$GITHUB_SHA")
          grep -Fq 'https://fabingurung.github.io/jp-field-desk-library/resources/project-documents.html' <<< "$packet"
          grep -Fq 'u.search = location.search' <<< "$packet"
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; j=json.load(sys.stdin); assert j["provenance"]["schema_version"]=="1.2.0"; assert j["identity"]["public_project_count"]==len(j["projects"]); assert j["provenance"]["engineering_completion"]=="NOT_CERTIFIED_BY_THIS_DASHBOARD"; print("FIELD_MAP_PUBLIC_PROJECTION_PASS",len(j["projects"]),len(j["notices"]),len(j["progress"]))'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Site Operations Engineer Map v2.6.0' --notes-file "$notes"
          fi

  release-status-v2-7:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify production status UI and memory wall before tagging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.7.0.md'
          tag='v2.7.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No v2.7.0 release notes changed in this commit"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css owner-help.html memory-wall.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "publication/operations/$file"
          done
          for entry in feasibility/index.html feasibility/buyer-guide/index.html; do
            body=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$entry?commit=$GITHUB_SHA")
            grep -Fq 'https://fabingurung.github.io/jp-field-desk-library/feasibility/' <<< "$body"
            grep -Fq 'u.search = location.search' <<< "$body"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; j=json.load(sys.stdin); p=j["projects"]; assert len(p)==j["identity"]["public_project_count"]; assert len({x["id"] for x in p})==len(p); assert j["provenance"]["source_authority"]=="GOOGLE_SHEETS"; assert j["provenance"]["engineering_completion"]=="NOT_CERTIFIED_BY_THIS_DASHBOARD"; assert all(isinstance(x.get("status"),str) for x in p); assert "PRJ-000030" not in {x["id"] for x in p}; print("STATUS_SHEETS_V2_PUBLIC_PASS",len(p))'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Site Operations Source-backed Mobile Filters v2.7.0' --notes-file "$notes"
          fi

  release-navigation-v2-8:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify deployed internal routes, source identity and tag exact milestone
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.8.0.md'
          tag='v2.8.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo "No v2.8.0 release note change"
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css progress.html progress.js sources.html sources.js owner-help.html memory-wall.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" \
              | cmp - "publication/operations/$file"
          done
          # Legacy bookmarks and independent sibling-website redirects remain safe.
          report=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/site-operations/history.html?commit=$GITHUB_SHA")
          grep -Fq '../progress.html' <<< "$report"
          for entry in feasibility/index.html feasibility/buyer-guide/index.html; do
            body=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$entry?commit=$GITHUB_SHA")
            grep -Fq 'https://fabingurung.github.io/jp-field-desk-library/feasibility/' <<< "$body"
            grep -Fq 'u.search = location.search' <<< "$body"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import sys,json; j=json.load(sys.stdin); p=j["provenance"]; assert j["identity"]["public_project_count"]==len(j["projects"]); assert p["source_authority"]=="GOOGLE_SHEETS"; assert p["engineering_completion"]=="NOT_CERTIFIED_BY_THIS_DASHBOARD"; assert all(n["category"] in ("Work","Materials","Supervision") for n in j["notices"]); assert "PRJ-000030" not in {x["id"] for x in j["projects"]}; print("NOTIFICATION_FIRST_LIVE_PASS", len(j["projects"]),len(j["notices"]),len(j["progress"]))'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Operations Notification-first Hybrid Pages v2.8.0' --notes-file "$notes"
          fi

  release-map-first-v2-9:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify seven original Sheets and deployed map-first field UI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v2.9.0.md'
          tag='v2.9.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo 'No new v2.9.0 notes in this push'
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css progress.html progress.js sources.html sources.js owner-help.html memory-wall.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "publication/operations/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; d=json.load(sys.stdin); p=d["provenance"]; i=d["identity"]; assert p["source_authority"]=="GOOGLE_SHEETS"; assert p["live_workbook_count"]==7; assert p["directory_role"]=="READ_ONLY_SOURCE_POINTER_VALIDATION"; assert set(p["directory_verified_inputs"])=={"projects","choices","messages","notices","progress","organizations"}; assert i["public_project_count"]==len(d["projects"]); assert i["live_project_ids_from"]=="Projects and Locations / projects"; assert i["historical_git_index_count"] is None; assert p["engineering_completion"]=="NOT_CERTIFIED_BY_THIS_DASHBOARD"; assert "PRJ-000030" not in {x["id"] for x in d["projects"]}; print("MAP_FIRST_SEVEN_SHEETS_PUBLIC_PASS",len(d["projects"]),len(d["notices"]),len(d["progress"]))'
          for entry in feasibility/index.html feasibility/buyer-guide/index.html; do
            body=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$entry?commit=$GITHUB_SHA")
            grep -Fq 'https://fabingurung.github.io/jp-field-desk-library/feasibility/' <<< "$body"
            grep -Fq 'u.search = location.search' <<< "$body"
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'Site Operations Map-first Field Workspace v2.9.0' --notes-file "$notes"
          fi

  release-extraction-v3-0:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify live source desk, mobile assets, seven original Sheets and exact release SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes='docs/releases/v3.0.0.md'
          tag='v3.0.0'
          if git diff --quiet HEAD^ HEAD -- "$notes"; then
            echo 'No new v3.0.0 release note in this main push'
            exit 0
          fi
          pages="https://fabingurung.github.io/${GITHUB_REPOSITORY#*/}"
          for file in index.html app.js styles.css navigation.js progress.html progress.js sources.html sources.js extraction.html extraction.js memory-wall.html owner-help.html; do
            curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$file?commit=$GITHUB_SHA" | cmp - "publication/operations/$file"
          done
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/extraction-status.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"]=="1.0.0"; assert d["batch_id"]=="OPS-B001"; assert d["validation"]["directory_verified"] is True; assert len(d["source_books"])==7; assert set(d["counts"])=={"projects","choices","messages","notices","progress","organizations","directory"}; assert d["lanes"]["01_messages"]["slack_collector"]=="NOT_CONNECTED_TO_ACTIONS"; assert d["lanes"]["04_demands"]["status"]=="SOURCE_NOT_CONNECTED"; assert d["public_project_count"]>=0; print("EXTRACTION_B001_LIVE_PASS",d["counts"],"FK_WARNINGS",d["validation"]["foreign_key_warnings"])'
          curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/operations.json?commit=$GITHUB_SHA" \
            | python -c 'import json,sys; d=json.load(sys.stdin); p=d["provenance"]; assert p["live_workbook_count"]==7; assert p["source_authority"]=="GOOGLE_SHEETS"; assert d["identity"]["public_project_count"]==len(d["projects"]); assert "PRJ-000030" not in {x["id"] for x in d["projects"]}; print("PUBLIC_PROJECTION_PASS",len(d["projects"]),len(d["notices"]),len(d["progress"]))'
          for entry in feasibility/index.html feasibility/buyer-guide/index.html; do
            body=$(curl -fsS --retry 6 --retry-delay 4 --retry-all-errors "$pages/$entry?commit=$GITHUB_SHA")
            grep -Fq 'https://fabingurung.github.io/jp-field-desk-library/feasibility/' <<< "$body"
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(git ls-remote origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'JP Site Operations Field Extraction Desk v3.0.0' --notes-file "$notes"
          fi
