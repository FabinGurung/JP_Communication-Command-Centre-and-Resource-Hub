name: Daily Ops branch preview

on:
  push:
    branches:
      - feature/daily-ops-current-work
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-feature-daily-ops
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Validate machine layer and page routes
        shell: python
        run: |
          import csv
          import json
          from pathlib import Path

          required_files = [
              Path("index.html"),
              Path("map.html"),
              Path("projects.csv"),
              Path("map-config.json"),
              Path("site-operations.html"),
              Path("site-operations/project.html"),
              Path("ops/data/current-works.json"),
              Path("ops/events/daily-ops-events.jsonl"),
              Path("ops/schema/current-works.schema.json"),
              Path("ops/schema/daily-ops-event.schema.json"),
              Path("ops/schema/daily-ops-postgres.sql"),
              Path("ops/CANONICAL_DATA_AUTHORITY.md"),
          ]
          missing = [str(p) for p in required_files if not p.exists()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          state = json.loads(Path("ops/data/current-works.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("ops/schema/current-works.schema.json").read_text(encoding="utf-8"))
          event_schema = json.loads(Path("ops/schema/daily-ops-event.schema.json").read_text(encoding="utf-8"))
          map_config = json.loads(Path("map-config.json").read_text(encoding="utf-8"))
          allowed_project_statuses = set(map_config.get("status_styles", {}))

          if state.get("schema_version") != "0.2.0":
              raise SystemExit("Unexpected Daily Ops schema_version.")
          if schema.get("properties", {}).get("schema_version", {}).get("const") != "0.2.0":
              raise SystemExit("Current-state schema does not pin version 0.2.0.")
          if event_schema.get("title") != "JP Ecosystem Daily Ops Event":
              raise SystemExit("Unexpected Daily Ops event schema identity.")

          event_lines = [
              line for line in Path("ops/events/daily-ops-events.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          events = []
          event_ids = set()
          event_required = {
              "event_id", "occurred_at", "event_type", "project_id",
              "work_id", "source_refs", "payload", "mutates_operational_truth"
          }
          for line_number, line in enumerate(event_lines, start=1):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"Invalid JSONL at line {line_number}: {error}")
              missing_keys = event_required - set(event)
              if missing_keys:
                  raise SystemExit(f"Event line {line_number} missing keys: {sorted(missing_keys)}")
              if event["event_id"] in event_ids:
                  raise SystemExit(f"Duplicate event_id: {event['event_id']}")
              if not isinstance(event["source_refs"], list):
                  raise SystemExit(f"Event {event['event_id']} source_refs must be a list.")
              event_ids.add(event["event_id"])
              events.append(event)

          with Path("projects.csv").open(newline="", encoding="utf-8-sig") as handle:
              project_reader = csv.DictReader(handle)
              project_rows = list(project_reader)
              project_headers = set(project_reader.fieldnames or [])

          required_project_headers = {
              "project_id", "company_project_code", "legacy_project_code",
              "project_name", "display_name", "executing_company_id",
              "latitude", "longitude", "status", "is_public"
          }
          missing_project_headers = required_project_headers - project_headers
          if missing_project_headers:
              raise SystemExit(f"projects.csv missing headers: {sorted(missing_project_headers)}")

          seen_map_ids = set()
          seen_legacy_ids = set()
          for line_number, row in enumerate(project_rows, start=2):
              map_id = row.get("project_id", "").strip()
              legacy_id = row.get("legacy_project_code", "").strip()
              status = row.get("status", "").strip()
              if not map_id:
                  raise SystemExit(f"projects.csv line {line_number}: project_id is blank.")
              if map_id in seen_map_ids:
                  raise SystemExit(f"projects.csv line {line_number}: duplicate project_id {map_id}.")
              seen_map_ids.add(map_id)
              if legacy_id:
                  if legacy_id in seen_legacy_ids:
                      raise SystemExit(f"projects.csv line {line_number}: duplicate legacy_project_code {legacy_id}.")
                  seen_legacy_ids.add(legacy_id)
              if status not in allowed_project_statuses:
                  raise SystemExit(
                      f"projects.csv line {line_number}: unknown status {status!r}; "
                      f"allowed={sorted(allowed_project_statuses)}"
                  )

          map_by_id = {row["project_id"].strip(): row for row in project_rows if row.get("project_id", "").strip()}
          map_by_legacy = {row["legacy_project_code"].strip(): row for row in project_rows if row.get("legacy_project_code", "").strip()}

          ops_projects = state.get("projects", [])
          ops_ids = [project["project_id"] for project in ops_projects]
          if len(set(ops_ids)) != len(ops_ids):
              raise SystemExit("Duplicate Daily Ops project_id detected.")

          allowed_conflicts = {"NONE", "UNSET", "UNRESOLVED"}
          allowed_projection = {"NOT_CONFIGURED", "PENDING", "CURRENT", "STALE", "ERROR"}
          allowed_gate = {"READY", "CONDITION", "HOLD", "NOT_READY", "UNKNOWN", "NOT_APPLICABLE"}
          allowed_execution = {"PLAN", "NOT_STARTED", "ONGOING", "PARTIAL", "DONE", "BLOCKED", "NEEDS_INPUT", "NOTE"}
          allowed_readiness = {"READY", "READY_WITH_CONDITION", "HOLD", "NOT_READY", "UNSET"}
          work_ids = set()

          for project in ops_projects:
              pid = project["project_id"]
              map_id = project["map_project_id"]
              legacy = project["legacy_project_code"]
              company_code = project["company_project_code"]

              if legacy != pid:
                  raise SystemExit(f"{pid}: legacy_project_code must equal stable Daily Ops project_id.")
              map_row = map_by_id.get(map_id)
              if not map_row:
                  raise SystemExit(f"{pid}: map_project_id {map_id} does not exist.")
              if map_row.get("legacy_project_code", "").strip() != legacy:
                  raise SystemExit(f"{pid}: legacy identity does not match map record.")
              if map_row.get("company_project_code", "").strip() != company_code:
                  raise SystemExit(f"{pid}: company project code does not match map record.")
              if map_by_legacy.get(legacy, {}).get("project_id", "").strip() != map_id:
                  raise SystemExit(f"{pid}: reverse legacy lookup does not resolve to {map_id}.")

              ops = project["daily_ops"]
              summary = ops["readiness_summary"]
              if summary["ready"] > summary["total"]:
                  raise SystemExit(f"{pid}: ready_count exceeds total_count.")
              if ops["overall_readiness"] not in allowed_readiness:
                  raise SystemExit(f"{pid}: invalid overall readiness.")
              if ops["conflict_state"] not in allowed_conflicts:
                  raise SystemExit(f"{pid}: invalid conflict_state.")

              projection = ops["projection_status"]
              if set(projection) != {"google_sheets", "website", "slack"}:
                  raise SystemExit(f"{pid}: projection_status targets are incomplete.")
              bad_projection = {k: v for k, v in projection.items() if v not in allowed_projection}
              if bad_projection:
                  raise SystemExit(f"{pid}: invalid projection status {bad_projection}.")

              for work in ops.get("todays_work", []):
                  wid = work["work_id"]
                  if wid in work_ids:
                      raise SystemExit(f"Duplicate work_id: {wid}")
                  work_ids.add(wid)
                  if work["execution_status"] not in allowed_execution:
                      raise SystemExit(f"{wid}: invalid execution_status.")
                  readiness = work["readiness"]
                  if readiness["overall"] not in allowed_readiness:
                      raise SystemExit(f"{wid}: invalid readiness overall.")
                  for gate_name in ("materials", "manpower", "ppe", "work_briefing", "tools", "preconditions"):
                      gate = readiness[gate_name]
                      if gate["status"] not in allowed_gate:
                          raise SystemExit(f"{wid}/{gate_name}: invalid gate status.")
                      if "source_refs" in gate and not isinstance(gate["source_refs"], list):
                          raise SystemExit(f"{wid}/{gate_name}: source_refs must be a list.")

          ops_id_set = set(ops_ids)
          for event in events:
              if event["project_id"] is not None and event["project_id"] not in ops_id_set:
                  raise SystemExit(f"Event {event['event_id']} references unknown project_id.")
              if event["work_id"] is not None and event["work_id"] not in work_ids:
                  raise SystemExit(f"Event {event['event_id']} references unknown work_id.")

          map_html = Path("map.html").read_text(encoding="utf-8")
          map_js = Path("assets/js/app.js").read_text(encoding="utf-8")
          ops_html = Path("site-operations.html").read_text(encoding="utf-8")
          project_ops_html = Path("site-operations/project.html").read_text(encoding="utf-8")
          hub_html = Path("index.html").read_text(encoding="utf-8")

          required_routes = {
              "hub -> map": "map.html",
              "hub -> site operations": "site-operations.html",
              "map -> project operations": "site-operations/project.html?project=",
              "site operations -> project detail": "site-operations/project.html?project=",
              "site operations -> machine state": "ops/data/current-works.json",
              "project detail -> event stream": "../ops/events/daily-ops-events.jsonl",
              "project detail -> machine state": "../ops/data/current-works.json",
          }
          checks = {
              "hub -> map": required_routes["hub -> map"] in hub_html,
              "hub -> site operations": required_routes["hub -> site operations"] in hub_html,
              "map -> project operations": required_routes["map -> project operations"] in (map_html + map_js),
              "site operations -> project detail": required_routes["site operations -> project detail"] in ops_html,
              "site operations -> machine state": required_routes["site operations -> machine state"] in ops_html,
              "project detail -> event stream": required_routes["project detail -> event stream"] in project_ops_html,
              "project detail -> machine state": required_routes["project detail -> machine state"] in project_ops_html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"Route validation failed: {failed}")

          print(
              f"PASS: schema={state['schema_version']}; map={len(project_rows)} projects; "
              f"daily_ops={len(ops_ids)} projects; {len(events)} JSONL event(s); "
              f"identity/provenance/projection/routes verified."
          )

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy branch preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
