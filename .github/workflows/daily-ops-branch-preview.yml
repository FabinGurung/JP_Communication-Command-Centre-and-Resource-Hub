name: Operations Hub production

on:
  push:
    branches:
      - feature/daily-ops-current-work
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production-main
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Validate machine layer and page routes
        shell: python
        run: |
          import csv
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          required_files = [
              Path("index.html"),
              Path("map.html"),
              Path("projects.csv"),
              Path("map-config.json"),
              Path("site-operations.html"),
              Path("site-operations/project.html"),
              Path("ops/data/current-works.json"),
              Path("ops/data/project-resources.json"),
              Path("ops/events/daily-ops-events.jsonl"),
              Path("ops/schema/current-works.schema.json"),
              Path("ops/schema/project-resources.schema.json"),
              Path("ops/schema/daily-ops-event.schema.json"),
              Path("ops/schema/daily-ops-postgres.sql"),
              Path("ops/CANONICAL_DATA_AUTHORITY.md"),
              Path("ops/PLATFORM_MODULES.md"),
              Path("workspace/index.html"),
              Path("workspace/links.json"),
              Path("workspace/modules.json"),
              Path("workspace/edit-routing.json"),
              Path("workspace/workspace.css"),
              Path("workspace/workspace.js"),
              Path("workspace.html"),
              Path("docs/WORKSPACE_GUIDE_ROADMAP.md"),
              Path("guide/index.html"),
              Path("guide/3-pages/index.html"),
              Path("guide/7-pages/index.html"),
              Path("guide/15-pages/index.html"),
              Path("guide/guide.css"),
              Path("guide/guide.js"),
              Path("guide/image-manifest.json"),
          ]
          missing = [str(p) for p in required_files if not p.exists()]
          if missing:
              raise SystemExit(f"Missing required files: {missing}")

          state = json.loads(Path("ops/data/current-works.json").read_text(encoding="utf-8"))
          schema = json.loads(Path("ops/schema/current-works.schema.json").read_text(encoding="utf-8"))
          event_schema = json.loads(Path("ops/schema/daily-ops-event.schema.json").read_text(encoding="utf-8"))
          resource_state = json.loads(Path("ops/data/project-resources.json").read_text(encoding="utf-8"))
          resource_schema = json.loads(Path("ops/schema/project-resources.schema.json").read_text(encoding="utf-8"))
          map_config = json.loads(Path("map-config.json").read_text(encoding="utf-8"))
          allowed_project_statuses = set(map_config.get("status_styles", {}))

          workspace = json.loads(Path("workspace/links.json").read_text(encoding="utf-8"))
          modules_state = json.loads(Path("workspace/modules.json").read_text(encoding="utf-8"))
          routing_state = json.loads(Path("workspace/edit-routing.json").read_text(encoding="utf-8"))

          if workspace.get("schema_version") != "1.0.0":
              raise SystemExit("Unexpected Workspace links schema_version.")
          group_ids = [g.get("id") for g in workspace.get("groups", [])]
          if not group_ids or len(group_ids) != len(set(group_ids)):
              raise SystemExit("Workspace groups are blank or duplicated.")
          resources = workspace.get("resources", [])
          resource_ids_workspace = [r.get("id") for r in resources]
          if not resources or len(resource_ids_workspace) != len(set(resource_ids_workspace)):
              raise SystemExit("Workspace resource IDs are blank or duplicated.")
          allowed_workspace_status = {"LIVE", "VERIFIED", "PREVIEW", "INCOMPLETE", "BLOCKED"}
          for item in resources:
              if item.get("group") not in set(group_ids):
                  raise SystemExit(f"Workspace resource {item.get('id')} references unknown group.")
              if item.get("status") not in allowed_workspace_status:
                  raise SystemExit(f"Workspace resource {item.get('id')} has invalid status.")
              for field in ("title", "url", "why", "how", "audience", "type", "source"):
                  if not str(item.get(field, "")).strip():
                      raise SystemExit(f"Workspace resource {item.get('id')} missing {field}.")


          if modules_state.get("schema_version") != "1.0.0":
              raise SystemExit("Unexpected Workspace modules schema_version.")
          modules = modules_state.get("modules", [])
          module_ids = [item.get("module_id") for item in modules]
          if not modules or len(module_ids) != len(set(module_ids)):
              raise SystemExit("Workspace module IDs are blank or duplicated.")
          required_module_fields = {
              "display_name", "repository", "repository_url", "pages_url",
              "default_branch", "status", "purpose", "owns", "does_not_own"
          }
          expected_repositories = {
              "operations": "FabinGurung/JP_Communication-Command-Centre-and-Resource-Hub",
              "scheduling": "FabinGurung/JP_Scheduling_Work_and_Resources_Management",
              "cost": "FabinGurung/JP_Cost_Estimation",
              "structural": "FabinGurung/JP_Structural_Analysis",
              "cad": "FabinGurung/JP_Computer-Aided-Drawings",
              "rd": "FabinGurung/JP_Research-and-Development",
              "study": "FabinGurung/JP_Study_Hub",
          }
          if set(module_ids) != set(expected_repositories):
              raise SystemExit(
                  f"Workspace module registry mismatch: {sorted(module_ids)}"
              )
          for item in modules:
              missing_fields = {
                  field for field in required_module_fields
                  if not item.get(field) and item.get(field) != []
              }
              if missing_fields:
                  raise SystemExit(
                      f"Workspace module {item.get('module_id')} missing {sorted(missing_fields)}"
                  )
              expected_repo = expected_repositories[item["module_id"]]
              if item["repository"] != expected_repo:
                  raise SystemExit(
                      f"Workspace module {item['module_id']} repository drift: "
                      f"{item['repository']} != {expected_repo}"
                  )
              if item["repository_url"] != f"https://github.com/{expected_repo}":
                  raise SystemExit(f"Workspace module {item['module_id']} repository_url drift.")
              if not isinstance(item["owns"], list) or not isinstance(item["does_not_own"], list):
                  raise SystemExit(f"Workspace module {item['module_id']} ownership fields must be lists.")

          if routing_state.get("schema_version") != "1.0.0":
              raise SystemExit("Unexpected Workspace edit-routing schema_version.")
          routes = routing_state.get("routes", [])
          route_ids = [item.get("id") for item in routes]
          if not routes or len(route_ids) != len(set(route_ids)):
              raise SystemExit("Workspace edit-route IDs are blank or duplicated.")
          for item in routes:
              for field in ("question", "owner", "type", "target", "module_id", "rule"):
                  if not str(item.get(field, "")).strip():
                      raise SystemExit(f"Workspace edit route {item.get('id')} missing {field}.")
              if item["module_id"] not in set(module_ids):
                  raise SystemExit(
                      f"Workspace edit route {item['id']} references unknown module {item['module_id']}."
                  )

          if state.get("schema_version") != "0.2.0":
              raise SystemExit("Unexpected Daily Ops schema_version.")
          if schema.get("properties", {}).get("schema_version", {}).get("const") != "0.2.0":
              raise SystemExit("Current-state schema does not pin version 0.2.0.")
          if event_schema.get("title") != "JP Ecosystem Daily Ops Event":
              raise SystemExit("Unexpected Daily Ops event schema identity.")
          if resource_state.get("schema_version") != "0.1.0":
              raise SystemExit("Unexpected project-resource schema_version.")
          if resource_schema.get("title") != "JP AEC Operations Hub Project Resources":
              raise SystemExit("Unexpected project-resource schema identity.")

          event_lines = [
              line for line in Path("ops/events/daily-ops-events.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          events = []
          event_ids = set()
          event_required = {
              "event_id", "occurred_at", "event_type", "project_id",
              "work_id", "source_refs", "payload", "mutates_operational_truth"
          }
          for line_number, line in enumerate(event_lines, start=1):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"Invalid JSONL at line {line_number}: {error}")
              missing_keys = event_required - set(event)
              if missing_keys:
                  raise SystemExit(f"Event line {line_number} missing keys: {sorted(missing_keys)}")
              if event["event_id"] in event_ids:
                  raise SystemExit(f"Duplicate event_id: {event['event_id']}")
              if not isinstance(event["source_refs"], list):
                  raise SystemExit(f"Event {event['event_id']} source_refs must be a list.")
              event_ids.add(event["event_id"])
              events.append(event)

          with Path("projects.csv").open(newline="", encoding="utf-8-sig") as handle:
              project_reader = csv.DictReader(handle)
              project_rows = list(project_reader)
              project_headers = set(project_reader.fieldnames or [])

          required_project_headers = {
              "project_id", "company_project_code", "legacy_project_code",
              "project_name", "display_name", "executing_company_id",
              "latitude", "longitude", "status", "is_public"
          }
          missing_project_headers = required_project_headers - project_headers
          if missing_project_headers:
              raise SystemExit(f"projects.csv missing headers: {sorted(missing_project_headers)}")

          seen_map_ids = set()
          seen_legacy_ids = set()
          for line_number, row in enumerate(project_rows, start=2):
              map_id = row.get("project_id", "").strip()
              legacy_id = row.get("legacy_project_code", "").strip()
              status = row.get("status", "").strip()
              if not map_id:
                  raise SystemExit(f"projects.csv line {line_number}: project_id is blank.")
              if map_id in seen_map_ids:
                  raise SystemExit(f"projects.csv line {line_number}: duplicate project_id {map_id}.")
              seen_map_ids.add(map_id)
              if legacy_id:
                  if legacy_id in seen_legacy_ids:
                      raise SystemExit(f"projects.csv line {line_number}: duplicate legacy_project_code {legacy_id}.")
                  seen_legacy_ids.add(legacy_id)
              if status not in allowed_project_statuses:
                  raise SystemExit(
                      f"projects.csv line {line_number}: unknown status {status!r}; "
                      f"allowed={sorted(allowed_project_statuses)}"
                  )

          map_by_id = {row["project_id"].strip(): row for row in project_rows if row.get("project_id", "").strip()}
          map_by_legacy = {row["legacy_project_code"].strip(): row for row in project_rows if row.get("legacy_project_code", "").strip()}

          resource_projects = resource_state.get("projects", [])
          resource_project_ids = [item.get("project_id") for item in resource_projects]
          if len(set(resource_project_ids)) != len(resource_project_ids):
              raise SystemExit("Duplicate project_id in project-resources.json.")
          resource_ids = set()
          allowed_root_resolution = {"VERIFIED", "UNRESOLVED"}
          allowed_preview = {"DRIVE_FOLDER", "DRIVE_PDF_PREVIEW", "DRIVE_FILE_OPEN"}
          for item in resource_projects:
              pid = item.get("project_id")
              map_id = item.get("map_project_id")
              root_resolution = item.get("root_resolution")
              resources = item.get("resources", [])
              if pid not in map_by_legacy:
                  raise SystemExit(f"Project resource set references unknown Daily Ops/project legacy id: {pid}")
              if map_by_legacy[pid].get("project_id", "").strip() != map_id:
                  raise SystemExit(f"{pid}: project resource map_project_id mismatch.")
              if root_resolution not in allowed_root_resolution:
                  raise SystemExit(f"{pid}: invalid root_resolution {root_resolution!r}.")
              roots = 0
              for resource in resources:
                  rid = resource.get("resource_id")
                  if not rid or rid in resource_ids:
                      raise SystemExit(f"{pid}: missing or duplicate resource_id {rid!r}.")
                  resource_ids.add(rid)
                  if resource.get("access_mode") != "DRIVE_PERMISSION_GATED":
                      raise SystemExit(f"{rid}: access_mode must be DRIVE_PERMISSION_GATED.")
                  if resource.get("preview_mode") not in allowed_preview:
                      raise SystemExit(f"{rid}: invalid preview_mode.")
                  url = resource.get("drive_url", "")
                  if not (url.startswith("https://drive.google.com/") or url.startswith("https://docs.google.com/")):
                      raise SystemExit(f"{rid}: drive_url is not a Google Drive/Docs URL.")
                  if not resource.get("drive_file_id"):
                      raise SystemExit(f"{rid}: drive_file_id is blank.")
                  if resource.get("resource_type") == "PROJECT_DRIVE_FOLDER" and resource.get("is_current") is not False:
                      roots += 1
              if root_resolution == "VERIFIED" and roots != 1:
                  raise SystemExit(f"{pid}: VERIFIED resource set must have exactly one current PROJECT_DRIVE_FOLDER.")
              if root_resolution == "UNRESOLVED" and roots != 0:
                  raise SystemExit(f"{pid}: UNRESOLVED resource set cannot publish a project root.")

          ops_projects = state.get("projects", [])
          ops_ids = [project["project_id"] for project in ops_projects]
          if len(set(ops_ids)) != len(ops_ids):
              raise SystemExit("Duplicate Daily Ops project_id detected.")

          allowed_conflicts = {"NONE", "UNSET", "UNRESOLVED"}
          allowed_projection = {"NOT_CONFIGURED", "PENDING", "CURRENT", "STALE", "ERROR"}
          allowed_gate = {"READY", "CONDITION", "HOLD", "NOT_READY", "UNKNOWN", "NOT_APPLICABLE"}
          allowed_execution = {"PLAN", "NOT_STARTED", "ONGOING", "PARTIAL", "DONE", "BLOCKED", "NEEDS_INPUT", "NOTE"}
          allowed_readiness = {"READY", "READY_WITH_CONDITION", "HOLD", "NOT_READY", "UNSET"}
          work_ids = set()

          for project in ops_projects:
              pid = project["project_id"]
              map_id = project["map_project_id"]
              legacy = project["legacy_project_code"]
              company_code = project["company_project_code"]

              if legacy != pid:
                  raise SystemExit(f"{pid}: legacy_project_code must equal stable Daily Ops project_id.")
              map_row = map_by_id.get(map_id)
              if not map_row:
                  raise SystemExit(f"{pid}: map_project_id {map_id} does not exist.")
              if map_row.get("legacy_project_code", "").strip() != legacy:
                  raise SystemExit(f"{pid}: legacy identity does not match map record.")
              if map_row.get("company_project_code", "").strip() != company_code:
                  raise SystemExit(f"{pid}: company project code does not match map record.")
              if map_by_legacy.get(legacy, {}).get("project_id", "").strip() != map_id:
                  raise SystemExit(f"{pid}: reverse legacy lookup does not resolve to {map_id}.")

              ops = project["daily_ops"]
              summary = ops["readiness_summary"]
              if summary["ready"] > summary["total"]:
                  raise SystemExit(f"{pid}: ready_count exceeds total_count.")
              if ops["overall_readiness"] not in allowed_readiness:
                  raise SystemExit(f"{pid}: invalid overall readiness.")
              if ops["conflict_state"] not in allowed_conflicts:
                  raise SystemExit(f"{pid}: invalid conflict_state.")

              projection = ops["projection_status"]
              if set(projection) != {"google_sheets", "website", "slack"}:
                  raise SystemExit(f"{pid}: projection_status targets are incomplete.")
              bad_projection = {k: v for k, v in projection.items() if v not in allowed_projection}
              if bad_projection:
                  raise SystemExit(f"{pid}: invalid projection status {bad_projection}.")

              for work in ops.get("todays_work", []):
                  wid = work["work_id"]
                  if wid in work_ids:
                      raise SystemExit(f"Duplicate work_id: {wid}")
                  work_ids.add(wid)
                  if work["execution_status"] not in allowed_execution:
                      raise SystemExit(f"{wid}: invalid execution_status.")
                  readiness = work["readiness"]
                  if readiness["overall"] not in allowed_readiness:
                      raise SystemExit(f"{wid}: invalid readiness overall.")
                  for gate_name in ("materials", "manpower", "ppe", "work_briefing", "tools", "preconditions"):
                      gate = readiness[gate_name]
                      if gate["status"] not in allowed_gate:
                          raise SystemExit(f"{wid}/{gate_name}: invalid gate status.")
                      if "source_refs" in gate and not isinstance(gate["source_refs"], list):
                          raise SystemExit(f"{wid}/{gate_name}: source_refs must be a list.")

          ops_id_set = set(ops_ids)

          static_workspace_projects = {
              item.get("id", "").upper()
              for item in workspace.get("resources", [])
              if item.get("group") == "projects"
          }
          if static_workspace_projects != ops_id_set:
              raise SystemExit(
                  "Workspace static project fallback must exactly cover current Daily Ops project IDs: "
                  f"fallback={sorted(static_workspace_projects)} daily_ops={sorted(ops_id_set)}"
              )

          for event in events:
              if event["project_id"] is not None and event["project_id"] not in ops_id_set:
                  raise SystemExit(f"Event {event['event_id']} references unknown project_id.")
              # JSONL is append-only history while current-works.json is CURRENT state.
              # Historical work_ids are therefore allowed to outlive today's todays_work array.
              if event["work_id"] is not None and (
                  not isinstance(event["work_id"], str) or not event["work_id"].strip()
              ):
                  raise SystemExit(f"Event {event['event_id']} has invalid non-null work_id.")

          map_html = Path("map.html").read_text(encoding="utf-8")
          map_js = Path("assets/js/app.js").read_text(encoding="utf-8")
          ops_html = Path("site-operations.html").read_text(encoding="utf-8")
          project_ops_html = Path("site-operations/project.html").read_text(encoding="utf-8")
          hub_html = Path("index.html").read_text(encoding="utf-8")
          workspace_html = Path("workspace/index.html").read_text(encoding="utf-8")
          workspace_js = Path("workspace/workspace.js").read_text(encoding="utf-8")
          legacy_workspace_html = Path("workspace.html").read_text(encoding="utf-8")
          legacy_howto_html = Path("how-to.html").read_text(encoding="utf-8")
          guide_root_html = Path("guide/index.html").read_text(encoding="utf-8")
          guide_3_html = Path("guide/3-pages/index.html").read_text(encoding="utf-8")
          guide_7_html = Path("guide/7-pages/index.html").read_text(encoding="utf-8")
          guide_15_html = Path("guide/15-pages/index.html").read_text(encoding="utf-8")
          guide_js = Path("guide/guide.js").read_text(encoding="utf-8")
          guide_css = Path("guide/guide.css").read_text(encoding="utf-8")
          guide_manifest = json.loads(Path("guide/image-manifest.json").read_text(encoding="utf-8"))

          if "./links.json" not in workspace_js:
              raise SystemExit("Workspace JS does not load the canonical links.json registry.")
          if "./modules.json" not in workspace_js or "./edit-routing.json" not in workspace_js:
              raise SystemExit("Workspace JS does not load the Phase 4 module/routing registries.")
          if "../projects.csv" not in workspace_js or "../ops/data/current-works.json" not in workspace_js:
              raise SystemExit("Workspace live project layer must read projects.csv + current-works.json.")
          for marker in ("live-project-summary", "live-project-status", "live-project-grid", "group-projects"):
              if marker not in workspace_html and marker != "group-projects":
                  raise SystemExit(f"Workspace page is missing live project marker: {marker}")
          if "parseCsv" not in workspace_js or "deriveOpsSignal" not in workspace_js or "loadLiveProjects" not in workspace_js:
              raise SystemExit("Workspace live project join/render functions are incomplete.")
          for function_name in ("loadModules", "loadRouting", "renderHealth"):
              if function_name not in workspace_js:
                  raise SystemExit(f"Workspace Phase 4 function missing: {function_name}")
          for marker in ("health-grid", "route-grid", "module-grid"):
              if marker not in workspace_html:
                  raise SystemExit(f"Workspace Phase 4 UI marker missing: {marker}")
          if "workspace.css" not in workspace_html or "workspace.js" not in workspace_html:
              raise SystemExit("Workspace page is missing its CSS/JS assets.")
          if 'location.replace("workspace/"' not in legacy_workspace_html:
              raise SystemExit("Legacy workspace.html does not redirect to canonical /workspace/.")
          if 'location.replace("guide/"' not in legacy_howto_html:
              raise SystemExit("Legacy how-to.html does not redirect to canonical /guide/.")
          if guide_manifest.get("schema_version") != "1.0.0":
              raise SystemExit("Unexpected guide image-manifest schema_version.")
          guide_images = guide_manifest.get("images", [])
          if guide_manifest.get("phase") != 3 or guide_manifest.get("status") != "ILLUSTRATED":
              raise SystemExit("Guide image manifest is not in Phase 3 illustrated state.")
          if len(guide_images) != 15:
              raise SystemExit(f"Expected 15 Phase 3 guide visuals, found {len(guide_images)}.")
          guide_image_ids = [item.get("id") for item in guide_images]
          guide_image_files = [item.get("file") for item in guide_images]
          if len(set(guide_image_ids)) != len(guide_image_ids) or len(set(guide_image_files)) != len(guide_image_files):
              raise SystemExit("Guide visual IDs/files must be unique.")
          for item in guide_images:
              if item.get("format") != "svg" or item.get("public_safe") is not True:
                  raise SystemExit(f"Guide visual {item.get('id')} must be public-safe SVG.")
              if not str(item.get("alt", "")).strip() or not str(item.get("title", "")).strip():
                  raise SystemExit(f"Guide visual {item.get('id')} is missing title/alt text.")
              image_path = Path("guide") / item["file"]
              if not image_path.is_file():
                  raise SystemExit(f"Guide visual is missing: {image_path}")
              try:
                  svg_root = ET.parse(image_path).getroot()
              except ET.ParseError as error:
                  raise SystemExit(f"Invalid SVG XML in {image_path}: {error}")
              if not svg_root.tag.endswith("svg"):
                  raise SystemExit(f"Unexpected SVG root in {image_path}.")
              image_text = image_path.read_text(encoding="utf-8")
              if "<title" not in image_text or "<desc" not in image_text:
                  raise SystemExit(f"Guide SVG {image_path} is missing title/desc accessibility metadata.")
              if Path(item["file"]).name not in guide_js:
                  raise SystemExit(f"Guide renderer does not reference manifested visual {item['file']}.")
          for depth, html in (("1", guide_root_html), ("3", guide_3_html), ("7", guide_7_html), ("15", guide_15_html)):
              if f'data-depth="{depth}"' not in html:
                  raise SystemExit(f"Guide depth {depth} shell is misconfigured.")
          for depth in ('"1"', '"3"', '"7"', '"15"'):
              if depth not in guide_js:
                  raise SystemExit(f"Guide renderer is missing depth {depth}.")
          if "window.print()" not in guide_js:
              raise SystemExit("Guide renderer is missing Print/Save PDF support.")
          if "@media print" not in guide_css:
              raise SystemExit("Guide CSS is missing print styles.")


          stale_names = (
              "jp-ecosystem-" + "project-map-v1",
              "jp-building-" + "cost-estimator",
              "Project_" + "Drawings",
              "Project-Controls-" + "Kernel",
          )
          text_suffixes = {".md", ".html", ".js", ".json", ".jsonl", ".yml", ".yaml", ".txt", ".csv", ".sql"}
          stale_hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              if path.as_posix() == "ops/PLATFORM_MODULES.md":
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for stale_name in stale_names:
                  if stale_name in content:
                      stale_hits.append(f"{path}:{stale_name}")
          if stale_hits:
              raise SystemExit(f"Stale repository names remain outside the migration note: {stale_hits}")

          required_routes = {
              "hub -> map": "map.html",
              "hub -> site operations": "site-operations.html",
              "map -> project operations": "site-operations/project.html?project=",
              "site operations -> project detail": "site-operations/project.html?project=",
              "site operations -> machine state": "ops/data/current-works.json",
              "project detail -> event stream": "../ops/events/daily-ops-events.jsonl",
              "project detail -> machine state": "../ops/data/current-works.json",
              "project detail -> resource registry": "../ops/data/project-resources.json",
              "site operations -> resource registry": "ops/data/project-resources.json",
              "hub -> workspace": "workspace/",
              "map -> workspace": "workspace/",
              "site operations -> workspace": "workspace/",
              "project detail -> workspace": "../workspace/",
              "hub -> guide": "guide/",
              "map -> guide": "guide/",
              "site operations -> guide": "guide/",
              "project detail -> guide": "../guide/",
          }
          checks = {
              "hub -> map": required_routes["hub -> map"] in hub_html,
              "hub -> site operations": required_routes["hub -> site operations"] in hub_html,
              "map -> project operations": required_routes["map -> project operations"] in (map_html + map_js),
              "site operations -> project detail": required_routes["site operations -> project detail"] in ops_html,
              "site operations -> machine state": required_routes["site operations -> machine state"] in ops_html,
              "project detail -> event stream": required_routes["project detail -> event stream"] in project_ops_html,
              "project detail -> machine state": required_routes["project detail -> machine state"] in project_ops_html,
              "project detail -> resource registry": required_routes["project detail -> resource registry"] in project_ops_html,
              "site operations -> resource registry": required_routes["site operations -> resource registry"] in ops_html,
              "hub -> workspace": required_routes["hub -> workspace"] in hub_html,
              "map -> workspace": required_routes["map -> workspace"] in map_html,
              "site operations -> workspace": required_routes["site operations -> workspace"] in ops_html,
              "project detail -> workspace": required_routes["project detail -> workspace"] in project_ops_html,
              "hub -> guide": required_routes["hub -> guide"] in hub_html,
              "map -> guide": required_routes["map -> guide"] in map_html,
              "site operations -> guide": required_routes["site operations -> guide"] in ops_html,
              "project detail -> guide": required_routes["project detail -> guide"] in project_ops_html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"Route validation failed: {failed}")

          print(
              f"PASS: schema={state['schema_version']}; map={len(project_rows)} projects; "
              f"daily_ops={len(ops_ids)} projects; resources={len(resource_ids)} link(s); "
              f"{len(events)} JSONL event(s); workspace={len(workspace.get('resources', []))} resources; "
              f"workspace_live_projects={len(ops_projects)}; "
              f"workspace_modules={len(modules)}; edit_routes={len(routes)}; "
              f"guide_visuals={len(guide_images)} SVGs; "
              f"identity/provenance/resource/projection/routes/workspace-live/health/routing/modules/stale-link-audit/fallback/guide-visuals verified."
          )

      - name: Phase 5 release QA
        run: python scripts/phase5_release_qa.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy main to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
