name: Validate pre-demo restore snapshot

on:
  push:
    branches:
      - archive/restore-pre-construction-demo-pages-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pre-demo site
        uses: actions/checkout@v4
        with:
          ref: 16ca8f558e7779f9681c35656808bffccb8cbc7b
          path: _site
      - name: Verify pre-demo tree
        run: |
          test -f _site/index.html
          test ! -e _site/construction-knowledge-demo
          test ! -e _site/.github/workflows/deploy-pages.yml
          echo "RESTORE_SNAPSHOT_VALIDATION=PASS"
          echo "Deployment intentionally disabled; production owner remains feature/daily-ops-current-work."
